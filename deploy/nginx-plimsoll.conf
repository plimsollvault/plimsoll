# Nginx site for the Plimsoll website. Replace example.com with your domain (two places),
# copy to /etc/nginx/sites-available/plimsoll, then run certbot to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/plimsoll;
    index index.html;

    # clean URLs: /page.html -> /page and /index.html -> /. Match the visitor's original URL;
    # a plain rewrite would also fire on the internal /index.html lookup and loop.
    if ($request_uri ~ "^/index\.html(\?.*)?$") { return 301 /; }
    if ($request_uri ~ "^/(.+)\.html(\?.*)?$") { return 301 /$1; }

    # one canonical host: send www to the bare domain
    if ($host = www.example.com) {
        return 301 $scheme://example.com$request_uri;
    }

    # the console is a view of the home page; everything else must exist or get the 404 page
    location = /console {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # the page and its config change on every release: always revalidate
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/plimsoll-headers.conf;
    }

    include /etc/nginx/snippets/plimsoll-headers.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
