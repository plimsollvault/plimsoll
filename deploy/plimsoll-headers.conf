# Security headers for the Plimsoll site. Copy to /etc/nginx/snippets/plimsoll-headers.conf.
# The page loads ethers from jsDelivr, fonts from Google, and talks to Robinhood Chain RPCs
# and the visitor's wallet, so connect-src allows any https/wss endpoint.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
